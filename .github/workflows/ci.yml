name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -e SC1091 android/start-proxy.sh ios/start-proxy.sh proxy_lab/common.sh proxy_lab/control.sh

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: unit and shell integration tests
        run: uv run python -m unittest discover -s tests -v
      - name: build and install package
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/proxy-lab-dist"
          uv build --out-dir "$dist"
          venv="$RUNNER_TEMP/proxy-lab-venv"
          uv venv "$venv"
          uv pip install --python "$venv/bin/python" "$dist"/*.whl
          "$venv/bin/proxy-lab" --version
          "$venv/bin/proxy-lab" --help >/dev/null
          python3 - "$dist"/*.whl <<'PY'
          import sys
          import zipfile

          wheel = sys.argv[1]
          required = {
              "proxy_lab/android/start-proxy.sh",
              "proxy_lab/ios/start-proxy.sh",
              "proxy_lab/common.sh",
              "proxy_lab/control.sh",
              "proxy_lab/config.py",
              "proxy_lab/local_router.py",
              "proxy_lab/domains.yaml",
          }
          with zipfile.ZipFile(wheel) as archive:
              missing = required.difference(archive.namelist())
          if missing:
              raise SystemExit(f"wheel is missing: {sorted(missing)}")
          PY

  smoke:
    name: proxy smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PORT: "18080"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: verify iOS local-mode arguments
        run: |
          # A fake host binary provides an argv-only check without starting the extension.
          fakebin="$(mktemp -d)"
          args="$RUNNER_TEMP/mitmdump-args"
          trap 'rm -rf "$fakebin" "$args"' EXIT
          cat >"$fakebin/mitmdump" <<'EOF'
          #!/usr/bin/env bash
          if [ "${1:-}" = "--version" ]; then
            printf 'Mitmproxy: 12.0.0\n'
            exit 0
          fi
          if [ "${1:-}" = "--listen-port" ] && [ "${2:-}" = "0" ]; then
            mkdir -p "$HOME/.mitmproxy"
            : >"$HOME/.mitmproxy/mitmproxy-ca-cert.pem"
          fi
          printf '%s\n' "$@" >"$MITMDUMP_ARGS"
          EOF
          cat >"$fakebin/xcrun" <<'EOF'
          #!/usr/bin/env bash
          if [ "${1:-}" = "simctl" ] && [ "${2:-}" = "list" ]; then
            printf '%s\n' '== Devices =='
          fi
          exit 0
          EOF
          chmod +x "$fakebin/mitmdump" "$fakebin/xcrun"
          MITMDUMP_ARGS="$args" PATH="$fakebin:$PATH" \
            uvx --from . proxy-lab start ios --script examples/modify_response.py
          grep -Fxq -- '--mode' "$args"
          grep -Fxq -- 'local:Simulator' "$args"
          grep -Fxq -- '--showhost' "$args"
          grep -Fq -- 'modify_response.py' "$args"
          ! grep -Fxq -- '--listen-port' "$args"
      - name: start proxy, verify routing
        run: |
          log=proxy.log

          # The local redirector needs interactive macOS approval. Check its
          # arguments above; use regular mode here for the headless smoke test.
          uv tool run --from 'mitmproxy@latest' mitmdump \
            --listen-host 0.0.0.0 \
            --listen-port "$PORT" \
            --set ssl_insecure=true \
            -s "$GITHUB_WORKSPACE/local_router.py" >"$log" 2>&1 &
          proxy=$!
          trap 'kill "$proxy" 2>/dev/null || true' EXIT

          fail() {
            echo "::error::$1"
            cat "$log"
            exit 1
          }

          # The first successful fetch is the readiness signal, including a
          # cold start while uv downloads mitmproxy.
          ready=""
          for _ in $(seq 1 120); do
            curl -sf --max-time 15 -o /dev/null -x "http://127.0.0.1:$PORT" http://www.example.com/ && {
              ready=1
              break
            }
            kill -0 "$proxy" 2>/dev/null || break
            sleep 1
          done
          [ -n "$ready" ] || fail "proxy never became ready on :$PORT"

          # domains.yaml has ".example.com": subdomains match, the apex does not.
          grep -q '\[local_router\] http://www\.example\.com/' "$log" ||
            fail "router did not log www.example.com"

          curl -sf --max-time 15 -o /dev/null -x "http://127.0.0.1:$PORT" http://example.com/ ||
            fail "apex fetch through proxy failed"
          curl -sf --max-time 15 -o /dev/null -x "http://127.0.0.1:$PORT" http://example.org/ ||
            fail "example.org fetch through proxy failed"

          if grep -q '\[local_router\] http://example\.com/' "$log"; then
            fail "router logged the apex — leading dot must exclude it"
          fi
          if grep -q '\[local_router\].*example\.org' "$log"; then
            fail "router logged example.org — not listed in domains.yaml"
          fi

          kill "$proxy" 2>/dev/null || true
          wait "$proxy" 2>/dev/null || true
          trap - EXIT

          echo "=== smoke ok ==="
          cat "$log"
