name: Release

# Tag push drives the release: tag 1.0.0 (no v prefix) → GitHub Release.
# The checked-in package version is the source of truth and must match the tag.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  # PyPI trusted publishing: OIDC exchange, no stored API token.
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Verify dependency lock
        run: uv lock --check
      - name: Verify tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          project_version="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' pyproject.toml)"
          test "$TAG" = "$project_version" || {
            echo "tag $TAG does not match pyproject.toml version $project_version" >&2
            exit 1
          }
          grep -Fq "## [$TAG]" CHANGELOG.md || {
            echo "CHANGELOG.md has no released section for $TAG" >&2
            exit 1
          }
      - name: Build
        run: uv build
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Replace artifacts when re-running after a partial failure.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
          fi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Do not fail if the PyPI release already exists.
          skip-existing: true
